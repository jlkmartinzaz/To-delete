version: "3.9"

services:
  web:
    build: .
    container_name: flask_api
    env_file: .env
    expose:
      - "5000"
    volumes:
      - .:/app
      - ./data:/app/data
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static
    depends_on:
      - web
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
