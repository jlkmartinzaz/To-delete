<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Usuario</title>
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f0f2f5;
}
.container {
  background-color: white;
  padding: 40px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  width: 300px;
}
h2 {
  text-align: center;
  margin-bottom: 20px;
}
input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}
button {
  width: 48%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}
.btn-register { background-color: #2196F3; color: white; }
.btn-back { background-color: #aaa; color: white; float: right; }
.msg {
  margin-top: 10px;
  text-align: center;
  color: red;
}
</style>
</head>
<body>
<div class="container">
<h2>Registro de Usuario</h2>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Contraseña" required>
<div>
<button class="btn-register" onclick="register()">Registrarse</button>
<button class="btn-back" onclick="goBack()">Volver</button>
</div>
<div class="msg" id="msg"></div>
</div>

<script>
const API_BASE = "{{ api_base }}"; // Flask injecta la URL correcta

function goBack() {
    window.location.href = "/";
}

async function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    msg.textContent = "";

    try {
        const res = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if(res.ok) {
            msg.style.color = "green";
            msg.textContent = "Registro exitoso!";
        } else {
            msg.style.color = "red";
            msg.textContent = data.error || data.message;
        }
    } catch(err) {
        msg.style.color = "red";
        msg.textContent = "Error de conexión";
        console.error(err);
    }
}
</script>
</body>
</html>
