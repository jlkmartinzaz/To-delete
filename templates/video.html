<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos de YouTube</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f0f2f5;
    text-align: center;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 900px;
    margin: 30px auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
input, button {
    padding: 6px;
    margin: 4px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
button { cursor: pointer; }
.video-card {
    border: 1px solid #ddd;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    text-align: left;
}
.admin-buttons {
    margin-top: 5px;
}
.role-display {
    margin: 10px 0;
    padding: 8px;
    background-color: #f9f9f9;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="container">
    <h2>Videos de YouTube</h2>

    <!-- Sección de agregar video -->
    <div id="add-video-section">
        <input type="text" id="youtube-url" placeholder="Agregar URL de YouTube">
        <button onclick="addVideo()">Agregar</button>
        <button onclick="loadVideos()">Cargar Videos</button>
        <button onclick="logout()">Logout</button>
    </div>

    <div id="videos"></div>
</div>

<script>
// --------------------------
// Tokens y rol
// --------------------------
let ACCESS_TOKEN = localStorage.getItem("access_token");
if(!ACCESS_TOKEN) window.location.href = "/";

function parseJwtRole(token) {
    try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.role || (payload.sub && JSON.parse(payload.sub).role) || "user";
    } catch {
        return "user";
    }
}

const currentRole = parseJwtRole(ACCESS_TOKEN);
const isAdmin = currentRole === "admin";

// --------------------------
// Mostrar rol actual
// --------------------------
function showUserRole() {
    let container = document.getElementById("user-role-display");
    if (!container) {
        container = document.createElement("div");
        container.id = "user-role-display";
        container.className = "role-display";
        document.body.prepend(container);
    }
    container.innerText = `Rol actual: ${currentRole}`;
}
showUserRole();

// --------------------------
// Funciones de videos
// --------------------------
async function addVideo() {
    if(!isAdmin) return alert("No tienes permisos de admin");

    const url = document.getElementById("youtube-url").value;
    if(!url) return alert("Ingresa una URL");

    try {
        const res = await fetch("/youtube/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + ACCESS_TOKEN
            },
            body: JSON.stringify({ url })
        });
        const data = await res.json();
        if(res.ok){
            alert("Video agregado correctamente!");
            loadVideos();
        } else {
            alert(data.error || data.message);
        }
    } catch(err) {
        console.error(err);
        alert("Error al agregar video");
    }
}

async function loadVideos() {
    try {
        const res = await fetch("/youtube/", {
            method: "GET",
            headers: { "Authorization": "Bearer " + ACCESS_TOKEN }
        });
        const data = await res.json();
        if(res.ok){
            const container = document.getElementById("videos");
            container.innerHTML = "";
            data.forEach(v => {
                const div = document.createElement("div");
                div.className = "video-card";
                div.innerHTML = `
                    <strong>${v.title}</strong><br>
                    ${v.description}<br>
                    Likes: ${v.likes}<br>
                    YouTube: <a href="https://youtu.be/${v.youtube_id}" target="_blank">${v.youtube_id}</a>
                    <div class="admin-buttons">
                        <input type="text" id="update-url-${v.id}" placeholder="Nueva URL">
                        <button onclick="updateVideo(${v.id})">Actualizar</button>
                        <button onclick="deleteVideo(${v.id})">Eliminar</button>
                        ${!isAdmin ? "<br><span style='color:red;'>No tienes permisos de admin</span>" : ""}
                    </div>
                `;
                container.appendChild(div);
            });
        } else {
            alert("Error al cargar videos");
        }
    } catch(err) {
        console.error(err);
        alert("Error al cargar videos");
    }
}

async function updateVideo(videoId) {
    if(!isAdmin) return alert("No tienes permisos de admin");

    const newUrl = document.getElementById(`update-url-${videoId}`).value;
    if(!newUrl) return alert("Ingresa una URL nueva");

    try {
        const res = await fetch(`/youtube/${videoId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + ACCESS_TOKEN
            },
            body: JSON.stringify({ url: newUrl })
        });
        const data = await res.json();
        if(res.ok){
            alert("Video actualizado!");
            loadVideos();
        } else {
            alert(data.error || data.message);
        }
    } catch(err) {
        console.error(err);
        alert("Error al actualizar video");
    }
}

async function deleteVideo(videoId) {
    if(!isAdmin) return alert("No tienes permisos de admin");

    if(!confirm("¿Seguro quieres eliminar este video?")) return;
    try {
        const res = await fetch(`/youtube/${videoId}`, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + ACCESS_TOKEN }
        });
        const data = await res.json();
        if(res.ok){
            alert("Video eliminado!");
            loadVideos();
        } else {
            alert(data.error || data.message);
        }
    } catch(err) {
        console.error(err);
        alert("Error al eliminar video");
    }
}

// --------------------------
// Logout
// --------------------------
function logout() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");
    window.location.href = "/";
}

// Cargar videos al inicio
window.onload = loadVideos;
</script>
</body>
</html>
