<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Videos</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
input, textarea, button { display: block; margin: 5px 0; width: 100%; }
</style>
</head>
<body>
<h2>Editar Video</h2>

<div>Rol: {{ user_role or 'Invitado' }}</div>
<button onclick="logout()">Logout</button>

<hr>

<label for="video-title">Título:</label>
<input type="text" id="video-title">

<label for="video-desc">Descripción:</label>
<textarea id="video-desc"></textarea>

<label for="video-url">URL de YouTube:</label>
<input type="text" id="video-url">

<button id="update-btn">Actualizar</button>
<button id="delete-btn">Eliminar</button>

<script>
const API_BASE = "{{ API_BASE }}";
const accessToken = localStorage.getItem("access_token");
const userRole = "{{ user_role }}";

const videoId = localStorage.getItem("edit_video_id");

// Mostrar botones solo si es admin
document.getElementById("update-btn").style.display = userRole === "admin" ? "block" : "none";
document.getElementById("delete-btn").style.display = userRole === "admin" ? "block" : "none";

async function fetchVideo() {
    const res = await fetch(`${API_BASE}/youtube/`, {
        headers: { "Authorization": `Bearer ${accessToken}` }
    });
    const videos = await res.json();
    const video = videos.find(v => v.id == videoId);
    if(video){
        document.getElementById("video-title").value = video.title;
        document.getElementById("video-desc").value = video.description;
        document.getElementById("video-url").value = `https://youtu.be/${video.youtube_id}`;
    }
}

document.getElementById("update-btn").onclick = async function(){
    const title = document.getElementById("video-title").value;
    const desc = document.getElementById("video-desc").value;
    const url = document.getElementById("video-url").value;
    const res = await fetch(`${API_BASE}/youtube/${videoId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${accessToken}` },
        body: JSON.stringify({ title, description: desc, url })
    });
    const data = await res.json();
    alert(data.message || data.error);
};

document.getElementById("delete-btn").onclick = async function(){
    if(!confirm("Eliminar video?")) return;
    const res = await fetch(`${API_BASE}/youtube/${videoId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${accessToken}` }
    });
    const data = await res.json();
    alert(data.message || data.error);
    window.location.href = "/videos.html";
};

function logout() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("edit_video_id");
    window.location.href = "/";
}

fetchVideo();
</script>
</body>
</html>
